permissions:
  contents: read

concurrency:
  group: minotaur-neural-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  neural-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact event head checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_head_sha="$(git rev-parse HEAD)"
          test "$actual_head_sha" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned CPU neural dependencies
        run: |
          python -m pip install --disable-pip-version-check -e . "numpy==2.5.4" "safetensors==0.8.0"
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"
      - name: Require CPU PyTorch and pinned versions
        run: |
          python - <<'PY'
          import numpy
          import safetensors
          import torch

          assert numpy.__version__ == "2.5.4", numpy.__version__
          assert safetensors.__version__ == "0.8.0", safetensors.__version__
          assert torch.__version__ == "2.5.1+cpu", torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          PY
      - name: Minotaur tests with neural dependencies present
        run: |
          python -m unittest discover -s tests -p 'test_ci_membership.py' -v
          python -m scripts.minotaur_ci
          python -m unittest tests.test_adaptive_corridors tests.test_journey_policy_runner tests.test_journey_challenges tests.test_semantic_chambers tests.test_minotaur_exam -v
          python -m unittest tests.test_hf_development_transition tests.test_hf_resume_bridge tests.test_hf_regenerative_harness -v
          python -m unittest tests.test_hf_pilot tests.test_hf_report_audit tests.test_hf_journey_resume_integration -v
          # Full-state optimizer recovery and measured frozen-base binding
          # are required CPU tests, never optional/skip-allowed smoke checks.
          python - <<'PY'
          import unittest

          recovery = unittest.defaultTestLoader.loadTestsFromName(
              "tests.test_neural_resume_checkpoint")
          recovery_result = unittest.TextTestRunner(verbosity=2).run(recovery)
          if (recovery_result.testsRun < 8 or not recovery_result.wasSuccessful()
                  or recovery_result.skipped):
              raise SystemExit("required full-state recovery CPU tests failed or skipped")

          base = unittest.defaultTestLoader.loadTestsFromName(
              "tests.test_frozen_base_binding")
          base_result = unittest.TextTestRunner(verbosity=2).run(base)
          if (base_result.testsRun < 9 or not base_result.wasSuccessful()
                  or base_result.skipped):
              raise SystemExit("required frozen-base CPU tests failed or skipped")

          taskmaster = unittest.defaultTestLoader.loadTestsFromName(
              "tests.test_qualify_minotaur_neural_taskmaster_cpu")
          taskmaster_result = unittest.TextTestRunner(verbosity=2).run(taskmaster)
          if (taskmaster_result.testsRun < 7 or not taskmaster_result.wasSuccessful()
                  or taskmaster_result.skipped):
              raise SystemExit("required neural taskmaster CPU tests failed or skipped")

          # This checks deterministic source and custody boundaries under the
          # pinned dependency-present runner. It is NOT a physical pretrained
          # training run or an independent private final examination.
          new_required = (
              ("tests.test_monotonic_anchor_protocol", 10),
              ("tests.test_retention_family_registry", 8),
              ("tests.test_retention_entrypoint_guard", 9),
              ("tests.test_qualify_maze_conditioned_minilm_cpu", 12),
              ("tests.test_qualify_neural_journey_e2e_cpu", 13),
              ("tests.test_qualify_taskmaster_counterfactual_cpu", 11),
              ("tests.test_measured_weakness_feedback", 7),
              ("tests.test_atomic_artifact_publication", 10),
              ("tests.test_preregistered_control_matrix", 18),
              ("tests.test_arithmetic_semantic_case_key", 7),
          )
          for module_name, min_count in new_required:
              suite = unittest.defaultTestLoader.loadTestsFromName(module_name)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if (result.testsRun < min_count or not result.wasSuccessful()
                      or result.skipped):
                  raise SystemExit(f"required CPU source/custody tests failed or skipped: {module_name}")
          PY
          python -m unittest tests.test_hf_scoped_report_audit tests.test_hf_program_scope tests.test_objective_contract tests.test_reserved_structural_transfer -v
