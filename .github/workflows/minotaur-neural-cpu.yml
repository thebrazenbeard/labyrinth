  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minotaur-neural-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  neural-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact event head checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_head_sha="$(git rev-parse HEAD)"
          test "$actual_head_sha" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned CPU neural dependencies
        run: |
          python -m pip install --disable-pip-version-check -e . "numpy==2.5.4" "safetensors==0.8.0" "cryptography==50.0.2"
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"
      - name: Require CPU PyTorch and pinned versions
        run: |
          python - <<'PY'
          import cryptography
          import numpy
          import safetensors
          import torch

          assert cryptography.__version__ == "50.0.2", cryptography.__version__
          assert numpy.__version__ == "2.5.4", numpy.__version__
          assert safetensors.__version__ == "0.8.0", safetensors.__version__
          assert torch.__version__ == "2.5.1+cpu", torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          PY
      - name: Minotaur tests with neural dependencies present
        run: |
          python -m unittest discover -s tests -p 'test_ci_membership.py' -v
          python -m scripts.minotaur_ci
          python -m unittest tests.test_adaptive_corridors tests.test_journey_policy_runner tests.test_journey_challenges tests.test_semantic_chambers tests.test_minotaur_exam -v
          python -m unittest tests.test_hf_development_transition tests.test_hf_resume_bridge tests.test_hf_regenerative_harness -v
          python -m unittest tests.test_hf_pilot tests.test_hf_report_audit tests.test_hf_journey_resume_integration -v
          # Full-state optimizer recovery and measured frozen-base binding
          # are required CPU tests, never optional/skip-allowed smoke checks.
          python - <<'PY'
          import unittest
          from scripts.minotaur_ci import missing_required, test_ids

          recovery = unittest.defaultTestLoader.loadTestsFromName(
              "tests.test_neural_resume_checkpoint")
          recovery_result = unittest.TextTestRunner(verbosity=2).run(recovery)
          if (recovery_result.testsRun < 8 or not recovery_result.wasSuccessful()
                  or recovery_result.skipped):
              raise SystemExit("required full-state recovery CPU tests failed or skipped")

          base = unittest.defaultTestLoader.loadTestsFromName(
              "tests.test_frozen_base_binding")
          base_result = unittest.TextTestRunner(verbosity=2).run(base)
          if (base_result.testsRun < 9 or not base_result.wasSuccessful()
                  or base_result.skipped):
              raise SystemExit("required frozen-base CPU tests failed or skipped")

          taskmaster = unittest.defaultTestLoader.loadTestsFromName(
              "tests.test_qualify_minotaur_neural_taskmaster_cpu")
          taskmaster_result = unittest.TextTestRunner(verbosity=2).run(taskmaster)
          if (taskmaster_result.testsRun < 7 or not taskmaster_result.wasSuccessful()
                  or taskmaster_result.skipped):
              raise SystemExit("required neural taskmaster CPU tests failed or skipped")

          # This checks deterministic source and custody boundaries under the
          # pinned dependency-present runner. It is NOT a physical pretrained
          # training run or an independent private final examination.
          new_required = (
              ("tests.test_monotonic_anchor_protocol", 10),
              ("tests.test_retention_family_registry", 8),
              ("tests.test_retention_entrypoint_guard", 9),
              ("tests.test_qualify_maze_conditioned_minilm_cpu", 12),
              ("tests.test_qualify_neural_journey_e2e_cpu", 13),
              ("tests.test_qualify_taskmaster_counterfactual_cpu", 11),
              ("tests.test_measured_weakness_feedback", 7),
              ("tests.test_atomic_artifact_publication", 10),
              ("tests.test_preregistered_control_matrix", 18),
              ("tests.test_arithmetic_semantic_case_key", 7),
              ("tests.test_measured_corridor_handoff", 5),
              ("tests.test_measured_taskmaster_transition", 5),
              ("tests.test_minotaur_development_feedback", 7),
              ("tests.test_authority_publication_service", 10),
              ("tests.test_arithmetic_retention_admission", 8),
              ("tests.test_development_event_reservation_service", 15),
              ("tests.test_measured_sentiment_corridors", 5),
              ("tests.test_minilm_optimizer_state_resume", 15),
              ("tests.test_sealed_semantic_exam_protocol", 17),
              ("tests.test_external_monotonic_authority_contract", 13),
              ("tests.test_measured_neural_batch_binding", 6),
              ("tests.test_minilm_runner_optimizer_optin", 5),
              ("tests.test_train_exposure_attestation", 10),
              ("tests.test_maze_crash_resume_journal", 13),
              ("tests.test_minilm_measured_batches_optin", 7),
              ("tests.test_signed_minotaur_tactic_neural_selection", 2),
              ("tests.test_pinned_model_inference_receipt", 12),
              ("tests.test_qualify_maze_measured_tactics_cpu", 4),
              ("tests.test_qualify_maze_multiseed_protocol_cpu", 21),
              ("tests.test_qualify_maze_prereg_controls_cpu", 5),
              ("tests.test_five_arm_experiment_contract", 39),
              ("tests.test_signed_minotaur_pair_r25", 10),
              ("tests.test_qualify_v2_weight_updates_cpu_r25", 18),
              ("tests.test_v2_checkpoint_cpu_smoke_r22", 5),
              ("tests.test_r36_toy_cpu_evidence_receipt", 9),
              ("tests.test_minotaur_exam_intake_guard_r36", 10),
              ("tests.test_r40_face_minotaur_primitive_boundary", 6),
              ("tests.test_r42_complete_maze_primitive_boundary", 5),
              ("tests.test_fullstate_physical_gate_r8", 1),
              ("tests.test_optimizer_runner_v2_r19", 7),
              ("tests.test_checkpoint_manifest_v2_r19", 6),
          )
          # A count alone is not a physical gate: replacing a real PyTorch
          # method with a trivial source test must invalidate qualification.
          required_physical_ids = (
              "tests.test_fullstate_physical_gate_r8.PhysicalFullStateContinuityGate.test_interrupted_vs_uninterrupted_adamw_rng_and_exposure_cursor",
              "tests.test_optimizer_runner_v2_r19.OptimizerRunnerV2ToyAdamWTests.test_v2_journal_binds_cycle0_receipt_and_restores_continuous_adamw",
              "tests.test_optimizer_runner_v2_r19.OptimizerRunnerV2ToyAdamWTests.test_v2_foreign_fork_is_rejected_and_pending_is_not_replayed",
              "tests.test_checkpoint_manifest_v2_r19.V2PhysicalCheckpointTests.test_real_adamw_v2_save_and_restore_never_cross_load_as_v1",
              "tests.test_v2_checkpoint_cpu_smoke_r22.ToyV2CpuPhysicalTests.test_real_toy_torch_adamw_two_cycle_resume_and_fresh_reload",
              "tests.test_qualify_v2_weight_updates_cpu_r25.WeightUpdatePhysicalTests.test_real_torch_tensor_updates_frozen_base_and_optimizer_moments",
              "tests.test_qualify_v2_weight_updates_cpu_r25.WeightUpdatePhysicalTests.test_noop_training_cannot_claim_real_learning",
          )
          discovered_ids = []
          for module_name, min_count in new_required:
              suite = unittest.defaultTestLoader.loadTestsFromName(module_name)
              discovered_ids.extend(test_ids(suite))
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              if (result.testsRun < min_count or not result.wasSuccessful()
                      or result.skipped):
                  raise SystemExit(f"required CPU source/custody tests failed or skipped: {module_name}")
          if missing_required(required_physical_ids, discovered_ids):
              raise SystemExit("required physical toy test identity missing or substituted")
          PY
          # These explicitly execute real toy CPU weight updates and a
          # regenerated-Maze full-state checkpoint/reload. Successful source
          # preflight alone is insufficient; physical evidence stays NONAUTHORIZING.
          python - <<'PY'
          import json
          import subprocess
          import sys

          probes = (
              ("scripts.qualify_v2_weight_updates_cpu_r25", (
                  "actual_trainable_tensor_updates_both_cycles",
                  "frozen_base_weights_unchanged",
                  "adamw_moments_advanced_both_cycles",
              )),
              ("scripts.qualify_v2_checkpoint_cpu_r22", (
                  "optimizer_fullstate_continuity_matches_uninterrupted_toy",
                  "final_fresh_fullstate_restore_verified",
              )),
          )
          for module, proofs in probes:
              result = subprocess.run(
                  [sys.executable, "-m", module, "--execute"],
                  check=True, capture_output=True, text=True, timeout=180,
              )
              evidence = json.loads(result.stdout)
              if (evidence.get("physical_cpu_toy_executed") is not True
                      or any(evidence.get(proof) is not True for proof in proofs)
                      or evidence.get("pretrained_model_loaded") is not False
                      or evidence.get("graduation_authorized") is not False):
                  raise SystemExit(f"toy CPU evidence incomplete/noncompliant: {module}")
              print(f"required source-only toy CPU execution PASS: {module}")
          PY
          python -m unittest tests.test_hf_scoped_report_audit tests.test_hf_program_scope tests.test_objective_contract tests.test_reserved_structural_transfer -v
      - name: Preserve two physical toy CPU probe reports without authority
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          checked_head="$(git rev-parse HEAD)"
          checked_tree="$(git rev-parse 'HEAD^{tree}')"
          evidence_path="${RUNNER_TEMP}/labyrinth-toy-cpu-evidence.json"
          python -m scripts.qualify_toy_cpu_evidence_r36 --execute \
            --source-head "$checked_head" \
            --source-tree "$checked_tree" \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output "$evidence_path"
          (cd "$RUNNER_TEMP" && sha256sum labyrinth-toy-cpu-evidence.json > labyrinth-toy-cpu-evidence.json.sha256)
      - name: Retain non-authorizing toy CPU evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minotaur-toy-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/labyrinth-toy-cpu-evidence*
          if-no-files-found: error
          retention-days: 14
