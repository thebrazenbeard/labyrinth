name: Minotaur neural CPU tests

on:
  pull_request:
    paths:
      - "labyrinth/minotaur_*.py"
      - "tests/test_minotaur_*.py"
      - "pyproject.toml"
      - ".github/workflows/minotaur-neural-cpu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minotaur-neural-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  neural-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact event head checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_head_sha="$(git rev-parse HEAD)"
          test "$actual_head_sha" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned CPU neural dependencies
        run: |
          python -m pip install --disable-pip-version-check -e . "numpy==2.5.4" "safetensors==0.8.0"
          python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"
      - name: Require CPU PyTorch and pinned versions
        run: |
          python - <<'PY'
          import numpy
          import safetensors
          import torch

          assert numpy.__version__ == "2.5.4", numpy.__version__
          assert safetensors.__version__ == "0.8.0", safetensors.__version__
          assert torch.__version__ == "2.5.1+cpu", torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          PY
      - name: Minotaur tests with neural dependencies present
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover(
              start_dir="tests", pattern="test_minotaur_*.py"
          )
          if suite.countTestCases() == 0:
              sys.exit("No Minotaur tests discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              sys.exit(f"Skipped Minotaur tests are not allowed: {result.skipped!r}")
          if not result.wasSuccessful():
              sys.exit(1)
          PY
