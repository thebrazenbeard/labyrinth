name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[auth]' "cryptography==50.0.2"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Offline CLI smoke
        run: python -m labyrinth run --seed 7 --count 6 --tiers 1,2,3 --adapter replay
