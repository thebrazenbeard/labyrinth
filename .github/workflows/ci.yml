name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      # The exploratory neural interaction tests skip when NumPy is absent.
      # Install it explicitly so these controls actually execute in CI.
      - name: Install optional neural research test dependency
        run: python -m pip install "numpy>=1.26,<3"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Offline CLI smoke
        run: python -m labyrinth run --seed 7 --count 6 --tiers 1,2,3 --adapter replay
