name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact event head checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_head_sha="$(git rev-parse HEAD)"
          test "$actual_head_sha" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          # The real offline-wheel regression uses --no-build-isolation and
          # therefore requires the PEP 517 backend in this interpreter.
          python -m pip install --disable-pip-version-check "setuptools==80.9.0"
          python -m pip install -e '.[auth]' "cryptography==50.0.2"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Offline CLI smoke
        run: python -m labyrinth run --seed 7 --count 6 --tiers 1,2,3 --adapter replay
