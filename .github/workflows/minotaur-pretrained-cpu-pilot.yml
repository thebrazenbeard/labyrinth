name: Minotaur pretrained CPU pilot (evidence only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/minotaur-pretrained-cpu-pilot.yml"
      - "labyrinth/hf_pilot.py"
      - "labyrinth/hf_report_audit.py"
      - "scripts/stage_smol_checkpoint.py"
      - "scripts/ci_pilot_verdict.py"

permissions:
  contents: read

concurrency:
  group: minotaur-pretrained-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-pretrained-update:
    name: SmolLM2-135M LoRA candidate and corrupted control (CPU)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MODEL_DIR: ${{ runner.temp }}/smollm2-135m-pinned
      PILOT_RUN: ${{ runner.temp }}/minotaur-real-pretrained-run
      PILOT_RELOAD: ${{ runner.temp }}/minotaur-reload.json
      PILOT_AUDIT: ${{ runner.temp }}/minotaur-audit.json
      PILOT_VERDICT: ${{ runner.temp }}/minotaur-verdict.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install pinned CPU neural dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_CACHE_DIR: "1"
        run: |
          python -m pip install --only-binary=:all: \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            torch==2.5.1+cpu numpy==1.26.4 transformers==4.57.6 \
            peft==0.18.1 huggingface-hub==0.36.0 accelerate==1.12.0 safetensors==0.6.2
          python -m pip check
      - name: Verify bounded CPU runtime
        run: |
          python -c "import platform, torch, transformers, peft; assert platform.system() == 'Linux'; assert torch.__version__ == '2.5.1+cpu'; assert transformers.__version__ == '4.57.6'; assert peft.__version__ == '0.18.1'; assert not torch.cuda.is_available()"
      - name: Stage public immutable pretrained safetensors without executable model code
        run: python scripts/stage_smol_checkpoint.py --destination "$MODEL_DIR"
      - name: Cut network access from model loader
        run: |
          echo 'HF_HUB_OFFLINE=1' >> "$GITHUB_ENV"
          echo 'TRANSFORMERS_OFFLINE=1' >> "$GITHUB_ENV"
      - name: Real LoRA optimizer updates, four arms and public held-out eval
        run: |
          timeout 1200s python -m labyrinth train-hf \
            --model-path "$MODEL_DIR" --output-dir "$PILOT_RUN" --device cpu \
            --seed 28041 --train-count 8 --eval-count 8 --tiers 1,2 \
            --steps 32 --max-tokens 256 --max-new-tokens 16
      - name: Fresh-process safetensors reload and repeated held-out inference
        run: |
          timeout 300s python -m labyrinth eval-hf \
            --run-dir "$PILOT_RUN" --report "$PILOT_RELOAD"
      - name: Offline receipt and decoded-trial audit
        run: |
          python -m labyrinth audit-hf-report \
            --input "$PILOT_RUN/pilot_report.json" --report "$PILOT_AUDIT"
      - name: Emit conservative non-graduation outcome
        run: |
          python scripts/ci_pilot_verdict.py \
            --train "$PILOT_RUN/pilot_report.json" --reload "$PILOT_RELOAD" \
            --audit "$PILOT_AUDIT" --output "$PILOT_VERDICT"
      - name: Preserve source-bound pilot reports and adapter for forensic inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: minotaur-pretrained-pilot-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/minotaur-real-pretrained-run/pilot_report.json
            ${{ runner.temp }}/minotaur-real-pretrained-run/candidate_adapter/**
            ${{ runner.temp }}/minotaur-reload.json
            ${{ runner.temp }}/minotaur-audit.json
            ${{ runner.temp }}/minotaur-verdict.json
