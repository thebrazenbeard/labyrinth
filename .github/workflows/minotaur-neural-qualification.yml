name: Minotaur neural checkpoint qualification

on:
  push:
    paths:
      - ".github/workflows/minotaur-neural-qualification.yml"
      - "labyrinth/minotaur_guarded.py"
      - "labyrinth/minotaur_scratch.py"
      - "models/minotaur_scratch_v1/**"
      - "models/minotaur_transition_v4_development/**"
      - "models/minotaur_algebraic_v5_development/**"
      - "tests/test_minotaur_neural_ci.py"
      - "labyrinth/minotaur_*.py"
      - "tests/test_minotaur_*.py"
  pull_request:
    paths:
      - ".github/workflows/minotaur-neural-qualification.yml"
      - "labyrinth/minotaur_guarded.py"
      - "labyrinth/minotaur_scratch.py"
      - "models/minotaur_scratch_v1/**"
      - "models/minotaur_transition_v4_development/**"
      - "models/minotaur_algebraic_v5_development/**"
      - "tests/test_minotaur_neural_ci.py"
      - "labyrinth/minotaur_*.py"
      - "tests/test_minotaur_*.py"

permissions:
  contents: read

jobs:
  saved-scratch-checkpoint:
    name: Saved scratch checkpoint (CPU)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install pinned optional CPU runtime only
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_CACHE_DIR: "1"
        run: |
          python -m pip install --only-binary=:all: \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            torch==2.5.1+cpu safetensors==0.4.5 numpy==1.26.4
      - name: Require the intended CPU-only runtime
        run: |
          python -c "import platform, safetensors, torch, numpy; assert numpy.__version__ == '1.26.4'; assert platform.system() == 'Linux'; assert platform.machine() == 'x86_64'; assert torch.__version__ == '2.5.1+cpu'; assert safetensors.__version__ == '0.4.5'; assert not torch.cuda.is_available()"
      - name: Reload saved checkpoint and infer one guarded trace
        run: timeout 90s python -m unittest discover -s tests -p "test_minotaur_neural_ci.py" -v
      - name: Execute scratch V2 model and new curriculum/ablation tests
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          timeout 90s python -m unittest tests.test_minotaur_scratch_v2 tests.test_minotaur_v3_ablation tests.test_minotaur_combinatorial_curriculum tests.test_minotaur_combinatorial_training -q
      - name: Execute actual learned V4 neural model and guarded reload tests
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          timeout 90s python -m unittest tests.test_minotaur_transition_v4 tests.test_minotaur_transition_curriculum tests.test_minotaur_transition_eval tests.test_minotaur_transition_study tests.test_minotaur_atomic_training tests.test_minotaur_transition_cli -q
      - name: Execute compact V5 learned algebraic checkpoint and composition tests
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          timeout 90s python -m unittest tests.test_minotaur_algebraic_v5 tests.test_minotaur_algebraic_data_v5 tests.test_minotaur_algebraic_training_v5 tests.test_minotaur_algebraic_eval_v5 tests.test_minotaur_algebraic_experiment_v5 tests.test_minotaur_algebraic_composer_v5 tests.test_minotaur_algebraic_composition_study_v5 tests.test_minotaur_algebraic_checkpoint_v5 -q
      - name: Execute V6 experimental direct multiplication and independent holdout tests
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          timeout 90s python -m unittest tests.test_minotaur_v6_spectral tests.test_minotaur_v6_latent tests.test_minotaur_v6_holdouts tests.test_minotaur_v6_mul_eval -q
